async function loadData(){
  var all=[],from=0,r;
  while(true){
    r=await SB.from('fuel_logs').select('*').order('date').range(from,from+999);
    if(r.error)throw r.error;
    all=all.concat(r.data);
    if(r.data.length<1000)break;
    from+=1000;
  }
  data=all.map(mapRow);
}
async function insertRows(rows){
  var add=[];

  });

    var r=await SB.from('fuel_logs').insert(add.slice(i,i+300)).select();
    if(r.error)throw r.error;
    r.data.forEach(function(e){data.push(mapRow(e))});
  }
  return add.length;
}

function f(n,d){return(n==null||!isFinite(n))?'–':n.toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtD(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+(+p[0]+543)}
function bk(date){
  if(per==='a')return 'all';
  if(per==='m')return date.slice(0,7);
  var d=new Date(date+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));

function enrich(){
  var s=data.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.odo-b.odo});
  var last={},prev=null;
  s.forEach(function(e){
    e.dA=e.dS=null;if(e.fuel==='o')return;
    if(prev!=null){var d=e.odo-prev;e.dA=(d>=0&&d<=1500)?d:null}
    prev=e.odo;
    if(last[e.fuel]!=null){var q=e.odo-last[e.fuel];e.dS=(q>0&&q<=5000)?q:null}
    last[e.fuel]=e.odo;
  });
  return s;
}
function stats(list){
  var r={baht:0,L:0,dist:0,Lc:0,bc:0,p:{n:0,L:0,baht:0,d:0,Ld:0},l:{n:0,L:0,baht:0,d:0,Ld:0}};
  list.forEach(function(e){
    if(e.fuel==='o')return;
    var L=lt(e);if(!(e.liters>0))r.est=true;
    r.baht+=e.amount;r.L+=L;
    if(e.dA!=null){r.dist+=e.dA;r.Lc+=L;r.bc+=e.amount}
    var x=r[e.fuel];x.n++;x.L+=L;x.baht+=e.amount;
    if(e.dS!=null){x.d+=e.dS;x.Ld+=L}
  });
  r.kml=r.Lc?r.dist/r.Lc:null;r.bpk=r.dist?r.bc/r.dist:null;
  ['p','l'].forEach(function(k){r[k].kml=r[k].Ld?r[k].d/r[k].Ld:null;r[k].bpl=r[k].L?r[k].baht/r[k].L:null});
  return r;
}
function dd(s){return Math.round(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5)}
function ds(n){var d=new Date(n*864e5);return d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2)+'-'+('0'+d.getUTCDate()).slice(-2)}
function spread(s){
  var D={},prev=null,nxt={},nd={},mx=0,ps={};
  s.forEach(function(e){if(e.fuel!=='o'){var n=dd(e.date);if(n>mx)mx=n}});
  for(var j=s.length-1;j>=0;j--){var q=s[j];if(q.fuel==='o')continue;nd[j]=nxt[q.fuel];nxt[q.fuel]=dd(q.date)}
  function g(n){return D[n]||(D[n]={dist:0,cov:0,Lp:0,Ll:0,Bp:0,Bl:0})}
  s.forEach(function(e,j){
    if(e.fuel==='o')return;
    var n=dd(e.date),a,m,i,x,o;
    if(prev&&e.dA!=null){a=dd(prev.date);m=Math.max(1,n-a);for(i=1;i<=m;i++){x=n>a?a+i:n;o=g(x);o.dist+=e.dA/m;o.cov=1}}
    prev=e;
    var k=e.fuel,Lq=lt(e),nx=nd[j],sp,lo,hi;
    if(nx!=null){sp=nx-n;if(sp>=1){lo=n+1;hi=nx;ps[k]=sp}else{lo=hi=n;sp=1}}
    else{sp=Math.max(ps[k]||30,mx-n);lo=n+1;hi=mx}
    for(i=lo;i<=hi;i++){o=g(i);o['L'+k]+=Lq/sp;o['B'+k]+=e.amount/sp}
  });
  return D;
}
function chartHtml(D){

  Object.keys(D).forEach(function(d){var k=bk(ds(+d)),c=C[k]||(C[k]={dist:0,Bp:0,Bl:0,cL:0}),o=D[d];c.dist+=o.dist;c.Bp+=o.Bp;c.Bl+=o.Bl;if(o.cov)c.cL+=o.Lp+o.Ll});
  var ks=Object.keys(C).sort();ks=ks.slice(-(per==='w'?26:24));

  var bw=pw/n*0.7;

  var ttl=sv==='w'?'รายสัปดาห์ (26 สัปดาห์ล่าสุด)':'รายเดือน (24 เดือนล่าสุด)';
  var h='<div class="card"><b>ค่าใช้จ่าย (บาท) '+ttl+'</b><svg class="ch" viewBox="0 0 '+W+' '+H+'">'+s1+xl+'</svg><div class="lg"><i class="rp"></i>น้ำมัน<i class="rl"></i>LPG</div></div>';
  var v=ks.map(function(k){var c=C[k];return(c.cL>0&&c.dist>0)?c.dist/c.cL:null});

    var d='',pen=false,dots='';

    h+='<div class="card"><b>กม./ลิตร รวม 2 ระบบ '+ttl+'</b><svg class="ch" viewBox="0 0 '+W+' '+H+'">'+s2+xl+'<path class="ln" d="'+d+'"/>'+dots+'</svg></div>';
  }

}
function ov2(){

  [['p','น้ำมัน','fp'],['l','LPG','fl']].forEach(function(t){
    var k=t[0],Lk=r['L'+k],Bk=r['B'+k];
    h+='<div class="card"><b class="'+t[2]+'">'+t[1]+'</b> <span class="note">สัดส่วนค่าใช้จ่าย '+f(x.T?Bk/x.T*100:null,0)+'%</span><div class="grid" style="margin-top:6px"><div><div class="k">ลิตร</div><div class="v">'+f(Lk,1)+'</div></div><div><div class="k">บาท</div><div class="v">'+f(Bk,0)+'</div></div><div><div class="k">บาท/ลิตร</div><div class="v">'+f(Lk?Bk/Lk:null,2)+'</div></div><div><div class="k">บาท/กม.</div><div class="v">'+f(r.dist?r['cB'+k]/r.dist:null,2)+'</div></div></div></div>';
  });
  h+=chartHtml(D);
  h+='<div class="card"><b>เทียบทุกช่วงเวลา</b><div class="sc"><table><tr><th>ช่วง</th><th>กม.</th><th>บาท</th><th>กม./ล.</th><th>บาท/กม.</th><th class="fp">%น้ำมัน</th></tr>';
  keys.forEach(function(k){var q=B[k],y=m(q);h+='<tr><td>'+bl(k)+'</td><td>'+f(q.dist,0)+'</td><td>'+f(y.T,0)+'</td><td>'+f(y.kml,2)+'</td><td>'+f(y.bpk,2)+'</td><td>'+f(y.sp,0)+'</td></tr>'});
  h+='</table></div></div>'+prc()+'<div class="note">การเติมแต่ละครั้งถูกกระจายรายวันนับจากวันที่เติมไปจนถึงการเติมเชื้อเพลิงชนิดเดียวกันครั้งถัดไป ครั้งล่าสุดนับเฉพาะส่วนที่ใช้ไปแล้ว ช่วงที่ไมล์ขาดหายจะไม่นับระยะทางและค่าใช้จ่ายในส่วน กม./ลิตร และ บาท/กม. การแยก กม./ลิตร รายเชื้อเพลิงทำไม่ได้ เพราะรถใช้ 2 ระบบสลับกัน จึงแสดงสัดส่วนและ บาท/กม. แทน</div>';
  return h;
}
function setTab(t){tab=t;armed=null;msg='';render()}
function setPer(p){per=p;sel=null;render()}
function authv(){
  return '<div class="card"><b>เข้าสู่ระบบ</b><div class="note">ข้อมูลเก็บบนเซิร์ฟเวอร์ ใช้ได้ทุกเครื่องที่ล็อกอินบัญชีเดียวกัน</div>'
   +'<label>อีเมล</label><input id="em" type="email" autocomplete="email">'
   +'<label>รหัสผ่าน (อย่างน้อย 6 ตัว)</label><input id="pw" type="password" autocomplete="current-password">'
   +'<div class="msg" id="mg">'+msg+'</div>'
   +'<button class="btn" onclick="login()">เข้าสู่ระบบ</button><button class="btn s" onclick="signup()">สมัครสมาชิก (ครั้งแรก)</button></div>';
}
function render(){
  var tb=document.getElementById('tabs'),vw=document.getElementById('view');
  if(!SB){tb.innerHTML='';vw.innerHTML='<div class="card">โหลดระบบฐานข้อมูลไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วรีเฟรชหน้า</div>';return}
  if(!ready){tb.innerHTML='';vw.innerHTML='<div class="card">กำลังโหลด...</div>';return}
  if(!user){tb.innerHTML='';vw.innerHTML=authv();return}
  document.getElementById('tabs').innerHTML=[['ov','ภาพรวม'],['add','เพิ่ม'],['hs','ประวัติ']].map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
  var v=document.getElementById('view');
  if(tab==='ov')v.innerHTML=ov2();else if(tab==='add')v.innerHTML=addv();else v.innerHTML=hs();
}
function ov(){
  var s=enrich();
  var h='<div class="seg">'+[['w','สัปดาห์'],['m','เดือน'],['a','ทั้งหมด']].map(function(t){return '<button class="'+(per===t[0]?'on':'')+'" onclick="setPer(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')+'</div>';
  if(!s.length)return h+'<div class="card">ยังไม่มีข้อมูล<button class="btn" onclick="seed()">โหลดข้อมูลย้อนหลัง (ธ.ค. 2566 – ต.ค. 2569)</button><div class="note" style="margin-top:8px">หรือไปแท็บ "เพิ่ม" เพื่อบันทึกเอง</div></div>';
  var keys=[],map={};
  s.forEach(function(e){var k=bk(e.date);if(!map[k]){map[k]=[];keys.push(k)}map[k].push(e)});
  keys.sort().reverse();
  if(!sel||!map[sel])sel=keys[0];
  if(per!=='a')h+='<select onchange="sel=this.value;render()" style="margin-bottom:10px">'+keys.map(function(k){return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+bl(k)+'</option>'}).join('')+'</select>';
  var r=stats(map[sel]);
  h+='<div class="card"><div class="grid">'
   +'<div><div class="k">ระยะทาง (กม.)</div><div class="v">'+f(r.dist,0)+'</div></div>'
   +'<div><div class="k">ค่าใช้จ่ายรวม (บาท)</div><div class="v">'+f(r.baht,0)+'</div></div>'
   +'<div><div class="k">กม./ลิตร รวม 2 ระบบ</div><div class="v">'+(r.est?'~':'')+f(r.kml,2)+'</div></div>'
   +'<div><div class="k">บาท/กม.</div><div class="v">'+f(r.bpk,2)+'</div></div></div></div>';
  [['p','น้ำมัน','fp'],['l','LPG','fl']].forEach(function(t){
    var x=r[t[0]];
    h+='<div class="card"><b class="'+t[2]+'">'+t[1]+'</b> <span class="note">('+x.n+' ครั้ง)</span><div class="grid" style="margin-top:6px">'
     +'<div><div class="k">ลิตร</div><div class="v">'+f(x.L,1)+'</div></div>'
     +'<div><div class="k">บาท</div><div class="v">'+f(x.baht,0)+'</div></div>'
     +'<div><div class="k">บาท/ลิตร เฉลี่ย</div><div class="v">'+f(x.bpl,2)+'</div></div>'
     +'<div><div class="k">กม./ลิตร</div><div class="v">'+f(x.kml,2)+'</div></div></div></div>';
  });
  h+='<div class="card"><b>เทียบทุกช่วงเวลา</b><div class="sc"><table><tr><th>ช่วง</th><th>กม.</th><th>บาท</th><th>กม./ล.รวม</th><th class="fp">น้ำมัน</th><th class="fl">LPG</th></tr>';
  keys.forEach(function(k){var q=stats(map[k]);h+='<tr><td>'+bl(k)+'</td><td>'+f(q.dist,0)+'</td><td>'+f(q.baht,0)+'</td><td>'+f(q.kml,2)+'</td><td>'+f(q.p.kml,2)+'</td><td>'+f(q.l.kml,2)+'</td></tr>'});
  h+='</table></div></div>'+prc()+'<div class="note">ช่วงที่ไม่มีบันทึกต่อเนื่อง (ไมล์ข้ามเกิน 1,500 กม.) จะไม่นับระยะทาง กม./ลิตร คำนวณจากระยะทางระหว่างการเติม ÷ ลิตรที่เติม (ถือว่าเติมเต็มถัง) ค่ารายเชื้อเพลิงใช้ระยะระหว่างการเติมชนิดเดียวกัน จึงเป็นค่าประมาณ เพราะรถใช้ 2 ระบบสลับกัน ค่ารวมเชื่อถือได้มากกว่า</div>';
  return h;
}
function addv(){
  return '<div class="card"><label>วันที่</label><input type="date" id="d" value="'+today()+'">'
   +'<label>เชื้อเพลิง</label><select id="fu"><option value="p">น้ำมัน</option><option value="l">LPG</option><option value="o">อื่นๆ (น้ำมันเครื่อง ฯลฯ ไม่นับในสถิติ)</option></select>'
   +'<label>เลขไมล์ (กม.)</label><input id="o" type="number" inputmode="decimal">'
   +'<div class="fr"><div><label>จำนวนเงิน (บาท)</label><input id="a" type="number" inputmode="decimal" oninput="pl()"></div>'
   +'<div><label>ลิตร (ไม่บังคับ)</label><input id="li" type="number" inputmode="decimal" oninput="pl()"></div></div>'
   +'<div class="note" id="pp" style="margin-top:6px"></div><div class="msg" id="mg">'+msg+'</div>'
   +'<button class="btn" onclick="add()">บันทึก</button></div>'
   +'<div class="note">ถ้าไม่ใส่ลิตร ระบบจะประมาณจากราคา/ลิตรที่ตั้งไว้ในหน้าภาพรวม</div>';
}
function pl(){var a=+document.getElementById('a').value,l=+document.getElementById('li').value;document.getElementById('pp').textContent=(a>0&&l>0)?'ราคาเฉลี่ย '+f(a/l,2)+' บาท/ลิตร':''}
async function add(){
  var d=document.getElementById('d').value,fu=document.getElementById('fu').value,o=+document.getElementById('o').value,a=+document.getElementById('a').value,l=+document.getElementById('li').value;
  var m=document.getElementById('mg');
  if(!d||!(o>0)||!(a>0)){m.textContent='กรอกวันที่ เลขไมล์ และจำนวนเงินให้ครบ';return}
  if(busy)return;busy=true;m.textContent='กำลังบันทึก...';
  try{
    var n=await insertRows([{date:d,fuel:fu,odo:o,amount:a,liters:l>0?l:null}]);
    msg=n?'บันทึกแล้ว':'มีรายการนี้อยู่แล้ว';tab='hs';render();
  }catch(e){m.textContent='บันทึกไม่สำเร็จ: '+e.message}
  busy=false;
}
function hs(){
  var s=enrich().reverse();
  var h='<div class="card">';
  if(!s.length)h+='ยังไม่มีประวัติ';
  s.forEach(function(e){
    h+='<div class="row"><div><span class="tag '+e.fuel+'">'+NM[e.fuel]+'</span> '+fmtD(e.date)+'<div class="note">ไมล์ '+f(e.odo,0)+(e.dA>0?' (+'+f(e.dA,0)+' กม.)':'')+' · '+(e.liters>0?f(e.liters,1)+' ล. · ':'')+f(e.amount,0)+' บาท'+(e.liters>0?' · '+f(e.amount/e.liters,2)+' บ./ล.':'')+'</div></div>'
     +'<button class="x" onclick="del(\''+e.id+'\')">'+(armed===e.id?'ยืนยันลบ':'ลบ')+'</button></div>';
  });
  h+='</div><div class="card"><button class="btn s" style="margin:0" onclick="seed()">โหลดข้อมูลย้อนหลัง (ธ.ค. 2566 – ต.ค. 2569)</button><div class="note">ข้ามรายการที่มีอยู่แล้ว</div>'+(localData().length?'<button class="btn s" onclick="impLocal()">นำเข้าข้อมูลที่เก็บในเครื่องนี้ ('+localData().length+' รายการ)</button>':'')+'</div><div class="card"><b>สำรองข้อมูล</b><div class="note">คัดลอกข้อความนี้เก็บไว้ หรือวางข้อมูลเดิมเพื่อกู้คืน ข้อมูลหลักอยู่บนเซิร์ฟเวอร์แล้ว ข้อความนี้เป็นสำเนาเพิ่มเติม วางเพื่อนำเข้าได้ (ข้ามรายการซ้ำ)</div>'
   +'<textarea id="bk" rows="4">'+JSON.stringify(data).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</textarea>'
   +'<button class="btn s" onclick="imp()">นำเข้าจากข้อความด้านบน</button><div class="msg" id="mg">'+msg+'</div></div><div class="card"><div class="note">ล็อกอินเป็น '+String(user.email).replace(/</g,'&lt;')+'</div><button class="btn s" onclick="logout()">ออกจากระบบ</button></div>';
  msg='';return h;
}
async function del(id){
  if(armed===id){
    try{
      var r=await SB.from('fuel_logs').delete().eq('id',id);
      if(r.error)throw r.error;
      data=data.filter(function(e){return e.id!==id});
    }catch(e){msg='ลบไม่สำเร็จ: '+e.message}
    armed=null;
  }else armed=id;
  render();
}
async function imp(){
  var m=document.getElementById('mg');
  try{
    var d=JSON.parse(document.getElementById('bk').value);
    if(!Array.isArray(d)||d.some(function(e){return !e||!e.date||!(e.odo>0)||!(e.amount>0)||'plo'.indexOf(e.fuel)<0}))throw 0;
    var n=await insertRows(d);
    msg='นำเข้า '+n+' รายการ (ข้ามรายการที่ซ้ำ)';render();
  }catch(e){m.textContent='รูปแบบข้อมูลไม่ถูกต้อง หรือนำเข้าไม่สำเร็จ'}
}
async function impLocal(){
  try{var n=await insertRows(localData());msg='นำเข้าจากเครื่องนี้ '+n+' รายการ'}
  catch(e){msg='นำเข้าไม่สำเร็จ: '+e.message}
  render();
}
function val(id){return document.getElementById(id).value.trim()}
function amsg(t){var m=document.getElementById('mg');if(m)m.textContent=t}
async function login(){
  var em=val('em'),pw=document.getElementById('pw').value;
  if(!em||!pw){amsg('กรอกอีเมลและรหัสผ่าน');return}
  amsg('กำลังเข้าสู่ระบบ...');
  var r=await SB.auth.signInWithPassword({email:em,password:pw});
  if(r.error)amsg('เข้าสู่ระบบไม่สำเร็จ: '+r.error.message);
}
async function signup(){
  var em=val('em'),pw=document.getElementById('pw').value;
  if(!em||pw.length<6){amsg('กรอกอีเมล และรหัสผ่านอย่างน้อย 6 ตัว');return}
  amsg('กำลังสมัคร...');
  var r=await SB.auth.signUp({email:em,password:pw});
  if(r.error){amsg('สมัครไม่สำเร็จ: '+r.error.message);return}
  if(!r.data.session)amsg('สมัครแล้ว ตรวจอีเมลแล้วกดลิงก์ยืนยัน จากนั้นกลับมาเข้าสู่ระบบ');
}
async function logout(){await SB.auth.signOut()}
async function boot(sess){
  if(ready&&user&&sess&&sess.user&&sess.user.id===user.id)return;
  user=sess&&sess.user?sess.user:null;
  if(!user){data=[];tab='ov'}
  else{msg='';try{await loadData()}catch(e){data=[];alert('โหลดข้อมูลไม่สำเร็จ: '+e.message)}}
  ready=true;render();
}
if(SB)SB.auth.onAuthStateChange(function(ev,sess){setTimeout(function(){boot(sess)},0)});
render();
</script>
</body>
</html>
